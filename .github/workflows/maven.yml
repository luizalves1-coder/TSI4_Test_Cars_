
name: Teste do Projeto Java Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar e executar testes
        run: ./mvnw -B clean verify

      - name: Verificar arquivo gerado
        run: ls -lh target/

      - name: Disponibilizar arquivo WAR
        uses: actions/upload-artifact@v4
        with:
          name: LojaCarro-WAR
          path: target/*.war
          if-no-files-found: error
          retention-days: 7
